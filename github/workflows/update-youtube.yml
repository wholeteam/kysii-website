yaml
name: Refresh YouTube Shorts
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}      # lets you run it by hand from the Actions tab
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/update_youtube.py
      - name: Commit if the list changed
        id: commit
        run: |
          git config user.name "kysii-site-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/youtube.json
          # only the timestamp changing doesn't count as new content
          if git diff --cached -U0 public/data/youtube.json | grep -E '^[+-] ' | grep -v '"updated"' | grep -q .; then
            git commit -m "Refresh YouTube Shorts"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No new Shorts"
          fi
      - name: Publish to Firebase
        if: steps.commit.outputs.changed == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KYSII_WEB }}
          channelId: live
          projectId: kysii-web
